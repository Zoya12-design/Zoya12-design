<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Zoya Hulio — AI and Full-Stack Developer</title>
  <desc id="desc">A dark futuristic blue and violet technology banner with glowing geometric details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset=".52" stop-color="#172554"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#c4b5fd" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="65" r="115" fill="#7c3aed" opacity=".28" filter="url(#blur)"/>
  <circle cx="920" cy="280" r="100" fill="#06b6d4" opacity=".20" filter="url(#blur)"/>
  <path d="M0 255 C220 180 340 350 570 240 S950 145 1200 215" fill="none" stroke="url(#glow)" stroke-opacity=".38" stroke-width="2"/>
  <path d="M780 0 L1050 0 L1200 150" fill="none" stroke="#a5b4fc" stroke-opacity=".22" stroke-width="2"/>
  <g fill="none" stroke="url(#glow)" stroke-width="2" opacity=".8">
    <circle cx="1015" cy="145" r="76"/>
    <circle cx="1015" cy="145" r="58" stroke-dasharray="5 10"/>
    <path d="M1015 55V83 M1015 207V235 M925 145H953 M1077 145H1105"/>
  </g>
  <g fill="#e0e7ff" opacity=".8" font-family="monospace" font-size="14">
    <text x="900" y="130">&lt;AI /&gt;</text>
    <text x="975" y="175">{ code }</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="118" fill="#a5f3fc" font-size="17" font-weight="700" letter-spacing="5">HELLO, I'M</text>
    <text x="78" y="190" fill="#ffffff" font-size="62" font-weight="700">Zoya Hulio</text>
    <rect x="82" y="215" width="420" height="3" rx="2" fill="url(#glow)"/>
    <text x="82" y="255" fill="#dbeafe" font-size="23" letter-spacing="1">AI &amp; MACHINE LEARNING  •  FULL-STACK DEVELOPMENT</text>
    <text x="83" y="286" fill="#a5b4fc" font-size="14" letter-spacing="2">BUILDING IDEAS INTO REAL-WORLD PROJECTS</text>
  </g>
</svg>